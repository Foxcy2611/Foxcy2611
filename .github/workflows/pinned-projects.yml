name: Sync Featured Projects from Pinned

on:
  schedule:
    - cron: '17 5,17 * * *' # twice daily (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  sync-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch pinned repositories and update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const start = '<!-- FEATURED_PINNED:START -->';
            const end = '<!-- FEATURED_PINNED:END -->';

            const result = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  pinnedItems(first: 6, types: [REPOSITORY]) {
                    nodes {
                      ... on Repository {
                        name
                        url
                        owner { login }
                      }
                    }
                  }
                }
              }
            `, { login: owner });
            const pins = result.user?.pinnedItems.nodes.filter(Boolean) || [];
            if (pins.length === 0) {
              core.info('No pinned repositories: retaining existing cards.');
              return;
            }

            const card = (p) => {
              const imageUrl = new URL('https://github-stats-extended.vercel.app/api/pin');
              imageUrl.searchParams.set('username', p.owner.login);
              imageUrl.searchParams.set('repo', p.name);
              imageUrl.searchParams.set('theme', 'tokyonight');
              imageUrl.searchParams.set('hide_border', 'true');
              const src = imageUrl.toString().replace(/&/g, '&amp;');
              return `<a href="${p.url}"><img src="${src}" width="48%" alt="${p.name}" /></a>`;
            };
            const rows = [];
            for (let i = 0; i < pins.length; i += 2) {
              const twoCards = pins.slice(i, i + 2).map(card).join('\n');
              rows.push(`<p align="center">\n${twoCards}\n</p>`);
            }

            const file = await github.rest.repos.getContent({ owner, repo, path: 'README.md', ref: branch });
            if (Array.isArray(file.data) || !file.data.content) {
              throw new Error('README.md is not a regular file');
            }
            const oldReadme = Buffer.from(file.data.content, 'base64').toString('utf8');
            const a = oldReadme.indexOf(start);
            const b = oldReadme.indexOf(end);
            if (a < 0 || b < 0 || b <= a) {
              throw new Error('Missing FEATURED_PINNED markers in README.md');
            }
            const newReadme = oldReadme.slice(0, a + start.length)
              + '\n' + rows.join('\n\n') + '\n'
              + oldReadme.slice(b);
            if (newReadme === oldReadme) {
              core.info(`Already up to date (${pins.length} cards).`);
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'README.md', branch,
              message: 'docs: sync pinned repositories [skip ci]',
              sha: file.data.sha,
              content: Buffer.from(newReadme, 'utf8').toString('base64')
            });
            core.info(`Updated featured projects: ${pins.map(p => p.name).join(', ')}`);
