
name: YourTomo - GitHub Companion

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yourtomo-profile
  cancel-in-progress: false

jobs:
  generate-pet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate YourTomo
        uses: prsdx/github-pet@v1
        with:
          username: Foxcy2611
          timezone-offset-minutes: '420'
          pet-name: Bit
          accent-color: '#0E75B6'
          output-dir: dist
