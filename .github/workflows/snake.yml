name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Foxcy2611
          outputs: |
            dist/github-snake.svg?color_snake=#0E75B6&color_dots=#EBF2F8,#B0D4EC,#79B8D9,#3288C1,#0E75B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#161B22,#0E3A53,#115C80,#0E75B6,#38BDF8

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
