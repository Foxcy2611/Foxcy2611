name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated SVG (dark and light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Foxcy2611
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0E75B6&color_dots=#EBF8FF,#C8EAF9,#94D5F1,#4AA8D7,#0E75B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161B22,#0B3044,#135A77,#2086AD,#58A6FF

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
